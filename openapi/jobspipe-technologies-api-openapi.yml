openapi: 3.2.0
info:
  version: 1.0.0
  title: JobsPipe Technologies API
  description: Every job posting, one API. Search live job postings from 30+ sources.
servers:
- url: https://api.jobspipe.dev
  description: Production
tags:
- name: Technologies
paths:
  /v1/technologies:
    get:
      operationId: listTechnologies
      security:
      - bearerAuth: []
      tags:
      - Technologies
      summary: List technologies
      description: Technologies named in job postings, ranked by how many companies hire for them, with company and posting counts. Filter by kind, category or posting country. Costs one credit per call.
      parameters:
      - schema:
          type: string
          maxLength: 200
          pattern: ^[a-z_]+(,[a-z_]+)*$
        required: false
        name: kind
        in: query
      - schema:
          type: string
          maxLength: 400
          pattern: ^[a-z0-9-]+(,[a-z0-9-]+)*$
        required: false
        name: category
        in: query
      - schema:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z]{2}(,[A-Za-z]{2})*$
        required: false
        name: country
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        required: false
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
        required: false
        name: page
        in: query
      responses:
        '200':
          description: A page of technologies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type:
                    - string
                    - 'null'
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type: integer
                      limit:
                        type: integer
                      page:
                        type: integer
                    required:
                    - total_results
                    - limit
                    - page
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        technology:
                          type: object
                          properties:
                            slug:
                              type: string
                            name:
                              type: string
                            category:
                              type:
                              - string
                              - 'null'
                            category_slug:
                              type:
                              - string
                              - 'null'
                            parent_category:
                              type:
                              - string
                              - 'null'
                            kind:
                              type:
                              - string
                              - 'null'
                            logo:
                              type:
                              - string
                              - 'null'
                          required:
                          - slug
                          - name
                          - category
                          - category_slug
                          - parent_category
                          - kind
                          - logo
                        companies:
                          type: integer
                        jobs:
                          type: integer
                        first_date_found:
                          type:
                          - string
                          - 'null'
                        last_date_found:
                          type:
                          - string
                          - 'null'
                      required:
                      - technology
                      - companies
                      - jobs
                      - first_date_found
                      - last_date_found
                required:
                - as_of
                - metadata
                - data
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monthly credit quota exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  upgrade_url:
                    type: string
                    format: uri
                  dashboard_url:
                    type: string
                    format: uri
                  credits_used:
                    type: integer
                  credits_included:
                    type: integer
                required:
                - error
                - message
                - upgrade_url
                - dashboard_url
        '404':
          description: Unknown technology.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/technologies/resolve:
    post:
      operationId: resolveTechnologies
      security:
      - bearerAuth: []
      tags:
      - Technologies
      summary: Resolve names to technology slugs
      description: 'Turn a list of technology or product names, or vendor domains, into the slugs the company search takes, each with how it matched and how many companies and postings carry evidence for it. A name we do not track answers match: none. Costs nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  minItems: 1
                  maxItems: 2000
                  description: Technology or product names as you have them, or vendor domains such as okta.com. Up to 2,000.
              required:
              - names
              additionalProperties: false
      responses:
        '200':
          description: One row per name, in the order sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type:
                    - string
                    - 'null'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name as sent.
                        slug:
                          type:
                          - string
                          - 'null'
                          description: The technology slug to search with, or null when the name is not tracked.
                        technology_name:
                          type:
                          - string
                          - 'null'
                        match:
                          type: string
                          enum:
                          - exact
                          - alias
                          - domain
                          - prefix
                          - none
                          description: 'How the name matched: exact (the name itself), alias (a known alias once marketplace words are dropped), domain (a vendor''s domain), prefix (the name starts with the technology: check it), none (not tracked; no signal, not proof it is unused).'
                        companies:
                          type: integer
                          description: Companies with any evidence for the technology.
                        jobs:
                          type: integer
                          description: Postings that named it.
                      required:
                      - name
                      - slug
                      - technology_name
                      - match
                      - companies
                      - jobs
                required:
                - as_of
                - data
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Not signed in and no API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/technologies/export:
    get:
      operationId: exportTechnologies
      security:
      - bearerAuth: []
      tags:
      - Technologies
      summary: Export companies by technology
      description: Downloads every company matching the filters as CSV or JSON Lines, one line per company and technology. Builder package and above. Costs one credit per call plus one per company not already paid for this month, settled once the data is ready and before the download starts. One export at a time per account.
      parameters:
      - schema:
          anyOf:
          - type: string
            maxLength: 700
          - type: array
            items:
              type: string
              maxLength: 700
            maxItems: 100
          description: Companies using ANY of these technologies (comma-separated or repeated, at most 10).
        required: false
        description: Companies using ANY of these technologies (comma-separated or repeated, at most 10).
        name: company_technology_slug_or
        in: query
      - schema:
          anyOf:
          - type: string
            maxLength: 700
          - type: array
            items:
              type: string
              maxLength: 700
            maxItems: 100
          description: Companies using ALL of these technologies (comma-separated or repeated, at most 10).
        required: false
        description: Companies using ALL of these technologies (comma-separated or repeated, at most 10).
        name: company_technology_slug_and
        in: query
      - schema:
          anyOf:
          - type: string
            maxLength: 700
          - type: array
            items:
              type: string
              maxLength: 700
            maxItems: 100
          description: Exclude companies with any evidence for these technologies, at any tier.
        required: false
        description: Exclude companies with any evidence for these technologies, at any tier.
        name: company_technology_slug_not
        in: query
      - schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: array
            items:
              type: string
              maxLength: 200
            maxItems: 100
          description: Countries of the job postings that name the technology (ISO 3166-1 alpha-2).
        required: false
        description: Countries of the job postings that name the technology (ISO 3166-1 alpha-2).
        name: company_country_code_or
        in: query
      - schema:
          anyOf:
          - type: string
            maxLength: 26000
          - type: array
            items:
              type: string
              maxLength: 26000
            maxItems: 100
          description: 'Comma-separated, or repeat the parameter. Example: siemens.com.'
        required: false
        description: 'Comma-separated, or repeat the parameter. Example: siemens.com.'
        name: company_domain_or
        in: query
      - schema:
          anyOf:
          - type: string
            maxLength: 21000
          - type: array
            items:
              type: string
              maxLength: 200
            maxItems: 100
          description: Company names. Repeat the parameter for several names; commas stay part of the name.
        required: false
        description: Company names. Repeat the parameter for several names; commas stay part of the name.
        name: company_name_or
        in: query
      - schema:
          type: string
          enum:
          - confirmed
          - likely
          - mentioned
          default: likely
          description: 'Weakest evidence tier that counts: confirmed, likely (the default) or mentioned.'
        required: false
        description: 'Weakest evidence tier that counts: confirmed, likely (the default) or mentioned.'
        name: tier_min
        in: query
      - schema:
          type: integer
          minimum: 1
        required: false
        name: min_num_jobs_found
        in: query
      - schema:
          type: string
          enum:
          - csv
          - jsonl
          default: csv
          description: csv (the default) or jsonl.
        required: false
        description: csv (the default) or jsonl.
        name: format
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Export at most this many companies. Without it, a match over the plan's cap is refused.
        required: false
        description: Export at most this many companies. Without it, a match over the plan's cap is refused.
        name: limit
        in: query
      responses:
        '200':
          description: The export, streamed as an attachment.
          headers:
            X-Credits-Charged:
              schema:
                type: integer
              description: Credits this export cost.
            X-Companies-Already-Paid:
              schema:
                type: integer
              description: Companies in the file already paid for this month.
            X-Total-Companies:
              schema:
                type: integer
              description: Companies in the export.
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: A Free or Seeker plan, or not enough credits left this month for the export.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  upgrade_url:
                    type: string
                    format: uri
                  dashboard_url:
                    type: string
                    format: uri
                  credits_used:
                    type: integer
                  credits_included:
                    type: integer
                required:
                - error
        '404':
          description: Unknown technology.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '409':
          description: Another export for this account is being prepared (export_in_progress).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '503':
          description: Credits could not be checked; nothing was charged (export_billing_unavailable).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/technologies/{slug}:
    get:
      operationId: getTechnology
      security:
      - bearerAuth: []
      tags:
      - Technologies
      summary: One technology
      description: Companies by evidence tier, top countries and occupations, the top companies, companies that recently started hiring for it, and a monthly adoption series. Costs one credit per call.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^\.?[a-z0-9][a-z0-9+#./-]*$
        required: true
        name: slug
        in: path
      responses:
        '200':
          description: The technology.
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type:
                    - string
                    - 'null'
                  technology:
                    type: object
                    properties:
                      slug:
                        type: string
                      name:
                        type: string
                      category:
                        type:
                        - string
                        - 'null'
                      category_slug:
                        type:
                        - string
                        - 'null'
                      parent_category:
                        type:
                        - string
                        - 'null'
                      kind:
                        type:
                        - string
                        - 'null'
                      logo:
                        type:
                        - string
                        - 'null'
                    required:
                    - slug
                    - name
                    - category
                    - category_slug
                    - parent_category
                    - kind
                    - logo
                  companies:
                    type: integer
                  jobs:
                    type: integer
                  first_date_found:
                    type:
                    - string
                    - 'null'
                  last_date_found:
                    type:
                    - string
                    - 'null'
                  companies_by_tier:
                    type: object
                    properties:
                      confirmed:
                        type: integer
                      likely:
                        type: integer
                      mentioned:
                        type: integer
                    required:
                    - confirmed
                    - likely
                    - mentioned
                  top_countries:
                    type: array
                    items:
                      type: string
                  top_occupations:
                    type: array
                    items:
                      type: string
                  top_companies:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type:
                          - string
                          - 'null'
                        domain:
                          type:
                          - string
                          - 'null'
                        url:
                          type:
                          - string
                          - 'null'
                        logo:
                          type:
                          - string
                          - 'null'
                        tier:
                          type: string
                          enum:
                          - confirmed
                          - likely
                          - mentioned
                        confidence:
                          type: string
                          enum:
                          - high
                          - medium
                          - low
                        jobs:
                          type: integer
                        first_date_found:
                          type:
                          - string
                          - 'null'
                        last_date_found:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - name
                      - domain
                      - url
                      - logo
                      - tier
                      - confidence
                      - jobs
                      - first_date_found
                      - last_date_found
                  recently_adopted:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type:
                          - string
                          - 'null'
                        domain:
                          type:
                          - string
                          - 'null'
                        url:
                          type:
                          - string
                          - 'null'
                        logo:
                          type:
                          - string
                          - 'null'
                        tier:
                          type: string
                          enum:
                          - confirmed
                          - likely
                          - mentioned
                        confidence:
                          type: string
                          enum:
                          - high
                          - medium
                          - low
                        jobs:
                          type: integer
                        first_date_found:
                          type:
                          - string
                          - 'null'
                        last_date_found:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - name
                      - domain
                      - url
                      - logo
                      - tier
                      - confidence
                      - jobs
                      - first_date_found
                      - last_date_found
                  monthly_adoption:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                        companies:
                          type: integer
                          description: Companies whose first posting naming the technology is in this month.
                        active_companies:
                          type: integer
                          description: Companies with a posting naming it in this month.
                        jobs:
                          type: integer
                          description: Postings naming it in this month.
                      required:
                      - month
                      - companies
                      - active_companies
                      - jobs
                required:
                - as_of
                - technology
                - companies
                - jobs
                - first_date_found
                - last_date_found
                - companies_by_tier
                - top_countries
                - top_occupations
                - top_companies
                - recently_adopted
                - monthly_adoption
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monthly credit quota exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  upgrade_url:
                    type: string
                    format: uri
                  dashboard_url:
                    type: string
                    format: uri
                  credits_used:
                    type: integer
                  credits_included:
                    type: integer
                required:
                - error
                - message
                - upgrade_url
                - dashboard_url
        '404':
          description: Unknown technology.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your JobsPipe API key (starts with jp_live_).
