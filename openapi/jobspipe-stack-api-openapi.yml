openapi: 3.2.0
info:
  version: 1.0.0
  title: JobsPipe Stack API
  description: Every job posting, one API. Search live job postings from 30+ sources.
servers:
- url: https://api.jobspipe.dev
  description: Production
tags:
- name: Stack
paths:
  /v1/stack/scan:
    post:
      operationId: scanStack
      tags:
      - Stack
      summary: Detect a website's tech stack
      description: Given a domain, returns the technologies it serves (frameworks, analytics, CDNs, payment, SaaS widgets). Results are cached for 14 days.
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  minLength: 3
                  maxLength: 253
                  description: Domain to scan, e.g. "stripe.com". URLs and "www." are normalized.
                mode:
                  type: string
                  enum:
                  - auto
                  - html
                  - render
                  description: Scan strategy. auto (default) tries a fast HTTP fetch, then a headless render if results are thin.
              required:
              - domain
              description: Tech-stack scan request.
            example:
              domain: stripe.com
              mode: auto
      responses:
        '200':
          description: Detected tech stack
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  scanned_at:
                    type: string
                    description: ISO timestamp the result was produced.
                  http_status:
                    type: number
                  detected:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        name:
                          type: string
                        categories:
                          type: array
                          items:
                            type: string
                        confidence:
                          type: number
                          description: 0-100 match confidence.
                        version:
                          type:
                          - string
                          - 'null'
                        signals:
                          type: array
                          items:
                            type: object
                            properties:
                              kind:
                                type: string
                              match:
                                type: string
                            required:
                            - kind
                            - match
                        description:
                          type:
                          - string
                          - 'null'
                        website:
                          type:
                          - string
                          - 'null'
                        icon:
                          type:
                          - string
                          - 'null'
                        pricing:
                          type: array
                          items:
                            type: string
                        saas:
                          type: boolean
                        oss:
                          type: boolean
                      required:
                      - slug
                      - name
                      - categories
                      - confidence
                      - version
                      - signals
                      - description
                      - website
                      - icon
                      - pricing
                      - saas
                      - oss
                required:
                - domain
                - scanned_at
                - http_status
                - detected
              example:
                domain: stripe.com
                scanned_at: '2026-06-29T12:00:00Z'
                http_status: 200
                detected:
                - slug: react
                  name: React
                  categories:
                  - JavaScript frameworks
                  confidence: 100
                  version: null
                  signals:
                  - kind: script
                    match: react-dom
                  description: A JavaScript library for building user interfaces.
                  website: https://react.dev
                  icon: react.svg
                  pricing: []
                  saas: false
                  oss: true
        '400':
          description: Invalid domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  how_to_fix:
                    type: string
                  get_key:
                    type: string
                    format: uri
                  docs:
                    type: string
                    format: uri
                required:
                - error
                - message
                - how_to_fix
                - get_key
                - docs
        '402':
          description: Monthly quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  upgrade_url:
                    type: string
                    format: uri
                  dashboard_url:
                    type: string
                    format: uri
                  credits_used:
                    type: integer
                  credits_included:
                    type: integer
                required:
                - error
                - message
                - upgrade_url
                - dashboard_url
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  how_to_fix:
                    type: string
                  requests_per_second:
                    type: integer
                  retry_after_seconds:
                    type: integer
                  upgrade_url:
                    type: string
                    format: uri
                  docs:
                    type: string
                    format: uri
                required:
                - error
                - message
                - how_to_fix
                - retry_after_seconds
                - upgrade_url
                - docs
        '502':
          description: Scanner failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '504':
          description: Scan timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your JobsPipe API key (starts with jp_live_).
