openapi: 3.2.0
info:
  version: 1.0.0
  title: JobsPipe Labour Market Insights API
  description: Every job posting, one API. Search live job postings from 30+ sources.
servers:
- url: https://api.jobspipe.dev
  description: Production
tags:
- name: Labour Market Insights
paths:
  /v1/insights/salary/benchmark:
    post:
      operationId: insightsSalaryBenchmark
      tags:
      - Labour Market Insights
      summary: Salary benchmark
      description: Advertised-salary percentiles for an occupation code or a title match, optionally filtered by country and seniority. Requires occupation_code or title.
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                occupation_code:
                  type: string
                  pattern: ^\d{1,4}$
                title:
                  type: string
                  minLength: 2
                  maxLength: 120
                country:
                  type: string
                  pattern: ^[A-Z]{2}$
                seniority:
                  type: string
                  enum:
                  - entry
                  - mid
                  - senior
                  - lead
                  - exec
                window_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
              additionalProperties: false
            example:
              title: data engineer
              country: US
              seniority: senior
      responses:
        '200':
          description: Salary benchmark
          content:
            application/json:
              schema:
                type: object
                properties:
                  occupation_code:
                    type:
                    - string
                    - 'null'
                  occupation_label:
                    type:
                    - string
                    - 'null'
                  window_days:
                    type: integer
                  country:
                    type:
                    - string
                    - 'null'
                  count:
                    type: integer
                  currency:
                    type: string
                    enum:
                    - USD
                  percentiles:
                    type:
                    - object
                    - 'null'
                    properties:
                      p10:
                        type: number
                      p25:
                        type: number
                      p50:
                        type: number
                      p75:
                        type: number
                      p90:
                        type: number
                    required:
                    - p10
                    - p25
                    - p50
                    - p75
                    - p90
                  confidence:
                    type:
                    - string
                    - 'null'
                    enum:
                    - low
                    - medium
                    - high
                  suppressed:
                    type: boolean
                required:
                - occupation_code
                - occupation_label
                - window_days
                - country
                - count
                - currency
                - percentiles
                - confidence
                - suppressed
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  how_to_fix:
                    type: string
                  get_key:
                    type: string
                    format: uri
                  docs:
                    type: string
                    format: uri
                required:
                - error
                - message
                - how_to_fix
                - get_key
                - docs
        '402':
          description: Monthly quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  upgrade_url:
                    type: string
                    format: uri
                  dashboard_url:
                    type: string
                    format: uri
                  credits_used:
                    type: integer
                  credits_included:
                    type: integer
                required:
                - error
                - message
                - upgrade_url
                - dashboard_url
        '404':
          description: Unknown code or no data in window
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  how_to_fix:
                    type: string
                  requests_per_second:
                    type: integer
                  retry_after_seconds:
                    type: integer
                  upgrade_url:
                    type: string
                    format: uri
                  docs:
                    type: string
                    format: uri
                required:
                - error
                - message
                - how_to_fix
                - retry_after_seconds
                - upgrade_url
                - docs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your JobsPipe API key (starts with jp_live_).
x-provenance:
  method: harvested
  publisher: JobsPipe
  source: https://api.jobspipe.dev/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
