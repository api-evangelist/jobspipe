openapi: 3.2.0
info:
  version: 1.0.0
  title: JobsPipe Monitors API
  description: Every job posting, one API. Search live job postings from 30+ sources.
servers:
- url: https://api.jobspipe.dev
  description: Production
tags:
- name: Monitors
paths:
  /v1/monitors:
    post:
      operationId: createMonitor
      tags:
      - Monitors
      summary: Create a monitor
      description: Monitors a list of records and sends their events to one of your webhooks until the monitor expires. A job monitor sends job.closed when a job in it closes. The ids are looked up, so the response also says, for free, which are already closed and which match nothing; neither is added. Costs no credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: What the ids are. "job" today.
                ids:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                  minItems: 1
                  maxItems: 1000
                  description: Record ids as search returned them, up to 1000 per request.
                events:
                  type: array
                  items:
                    type: string
                  description: 'Events to send. Default: every event of the type ("job.closed").'
                webhook_id:
                  type: string
                  format: uuid
                  description: One of your webhooks, from /api/webhooks.
                expires_in_days:
                  type: number
                  description: How many days the monitor runs, a whole number from 1 to 365. Default 90.
              required:
              - type
              - ids
              - webhook_id
      responses:
        '201':
          description: The monitor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  events:
                    type: array
                    items:
                      type: string
                  webhook_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - expired
                  expires_at:
                    type: string
                  created_at:
                    type: string
                  target_count:
                    type: integer
                  open_target_count:
                    type: integer
                  already_closed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        closed_at:
                          type:
                          - string
                          - 'null'
                        closed_reason:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - closed_at
                      - closed_reason
                  not_found:
                    type: array
                    items:
                      type: string
                required:
                - id
                - type
                - events
                - webhook_id
                - status
                - expires_at
                - created_at
                - target_count
                - open_target_count
                - already_closed
                - not_found
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
    get:
      operationId: listMonitors
      tags:
      - Monitors
      summary: List monitors
      description: Your monitors, newest first. Pass next_cursor back as cursor. Costs no credits.
      parameters:
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 1000
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: One page of monitors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        events:
                          type: array
                          items:
                            type: string
                        webhook_id:
                          type: string
                        status:
                          type: string
                          enum:
                          - active
                          - expired
                        expires_at:
                          type: string
                        created_at:
                          type: string
                        target_count:
                          type: integer
                        open_target_count:
                          type: integer
                      required:
                      - id
                      - type
                      - events
                      - webhook_id
                      - status
                      - expires_at
                      - created_at
                      - target_count
                      - open_target_count
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - data
                - next_cursor
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/monitors/{id}:
    get:
      operationId: getMonitor
      tags:
      - Monitors
      summary: Get a monitor
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  events:
                    type: array
                    items:
                      type: string
                  webhook_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - expired
                  expires_at:
                    type: string
                  created_at:
                    type: string
                  target_count:
                    type: integer
                  open_target_count:
                    type: integer
                required:
                - id
                - type
                - events
                - webhook_id
                - status
                - expires_at
                - created_at
                - target_count
                - open_target_count
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
    delete:
      operationId: deleteMonitor
      tags:
      - Monitors
      summary: Delete a monitor
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
                    enum:
                    - true
                required:
                - id
                - deleted
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/monitors/{id}/renew:
    post:
      operationId: renewMonitor
      tags:
      - Monitors
      summary: Renew a monitor
      description: Sets the monitor to expire expires_in_days (default 90) from now. Works on an expired monitor too.
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: number
                  description: How many days the monitor runs, a whole number from 1 to 365. Default 90.
      responses:
        '200':
          description: The renewed monitor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  events:
                    type: array
                    items:
                      type: string
                  webhook_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - expired
                  expires_at:
                    type: string
                  created_at:
                    type: string
                  target_count:
                    type: integer
                  open_target_count:
                    type: integer
                required:
                - id
                - type
                - events
                - webhook_id
                - status
                - expires_at
                - created_at
                - target_count
                - open_target_count
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /v1/monitors/{id}/ids:
    post:
      operationId: addMonitorIds
      tags:
      - Monitors
      summary: Add records to a monitor
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                  minItems: 1
                  maxItems: 1000
                  description: Record ids as search returned them, up to 1000 per request.
              required:
              - ids
      responses:
        '200':
          description: What was added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  target_count:
                    type: integer
                  already_closed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        closed_at:
                          type:
                          - string
                          - 'null'
                        closed_reason:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - closed_at
                      - closed_reason
                  not_found:
                    type: array
                    items:
                      type: string
                required:
                - added
                - target_count
                - already_closed
                - not_found
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
    delete:
      operationId: removeMonitorIds
      tags:
      - Monitors
      summary: Remove records from a monitor
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                  minItems: 1
                  maxItems: 1000
                  description: Record ids as search returned them, up to 1000 per request.
              required:
              - ids
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                required:
                - removed
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
    get:
      operationId: listMonitorIds
      tags:
      - Monitors
      summary: List a monitor's records
      description: The records in a monitor in id order. A record whose event was sent shows status closed.
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: id
        in: path
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 1000
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: One page of records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        source_provider:
                          type:
                          - string
                          - 'null'
                        status:
                          type: string
                          enum:
                          - open
                          - closed
                        added_at:
                          type: string
                        closed_at:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - source_provider
                      - status
                      - added_at
                      - closed_at
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - data
                - next_cursor
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '402':
          description: Monitors need the Builder package or above, or the plan's monitoring limit would be passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No such monitor or webhook on this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your JobsPipe API key (starts with jp_live_).
