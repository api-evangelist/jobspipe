                                headcount_high:
                                  type:
                                  - integer
                                  - 'null'
                                  description: 'Upper bound of the headcount: the range behind the figure when the source gave one; null otherwise.'
                                lei:
                                  type:
                                  - string
                                  - 'null'
                                  description: The company's Legal Entity Identifier (ISO 17442), 20 characters. Null when we have not identified the company's legal entity.
                                legal_name:
                                  type:
                                  - string
