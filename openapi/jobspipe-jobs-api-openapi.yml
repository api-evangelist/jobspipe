                                  description: Fiscal year the revenue figure refers to.
                                revenue_source:
                                  type:
                                  - string
                                  - 'null'
                                  description: Short identifier of where the revenue figure came from, such as a business register, a securities filing or a company directory.
                                revenue_confidence:
                                  type:
