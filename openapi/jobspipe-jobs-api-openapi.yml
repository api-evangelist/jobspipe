openapi: 3.2.0
info:
  version: 1.0.0
  title: JobsPipe Jobs API
  description: Every job posting, one API. Search live job postings from 30+ sources.
servers:
- url: https://api.jobspipe.dev
  description: Production
tags:
- name: Jobs
paths:
  /v1/jobs/search:
    post:
      operationId: searchJobs
      tags:
      - Jobs
      summary: Search job postings
      description: Search live job postings from 30+ sources, normalized into a single schema.
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  description: Max results to return. Capped by your plan's page size.
                offset:
                  type: integer
                  minimum: 0
                  description: Results to skip (offset pagination).
                page:
                  type: integer
                  minimum: 0
                  description: Page index (alternative to offset).
                include_total_results:
                  type: boolean
                  description: Populate metadata.total_results (otherwise null).
                include_technologies:
                  type: boolean
                  description: Add `technologies`, the graded list of technologies each posting names, to every job. Off by default, and the field is then absent. Each returned job that names at least one technology costs 1 extra credit on top of the job's own credit, once per job per calendar month (UTC); jobs with none cost nothing extra.
                blur_company_data:
                  type: boolean
                  description: 'DEPRECATED and ignored. Preview mode has been removed: every search now returns unmasked records and is billed at one credit per job returned. Still accepted so existing integrations keep working; it has no effect on the response or the price.'
                job_title_or:
                  type: array
                  items:
                    type: string
                  description: Match jobs whose title contains any of these.
                job_title_not:
                  type: array
                  items:
                    type: string
                  description: Exclude jobs whose title contains any of these.
                description_or:
                  type: array
                  items:
                    type: string
                  description: Match jobs whose description contains any of these (e.g. a skill or tech).
                description_not:
                  type: array
                  items:
                    type: string
                  description: Exclude jobs whose description contains any of these.
                employment_type_or:
                  type: array
                  items:
                    type: string
                  description: 'Match any employment type: full-time, part-time, contract, temporary, internship.'
                language_or:
                  type: array
                  items:
                    type: string
                  description: 'Match postings WRITTEN in any of these languages, as lowercase ISO 639-1 codes, e.g. ["en"] or ["en","sv"]. This is the language of the posting text, not of the country: 18.3% of Swedish postings and 17.7% of German ones are in English, and Canada is 84.5% English with the rest French. Use it to fetch only the roles your team can actually read when hiring across a multilingual market. Postings we have not labelled never match - add include_unknown: ["language"] to keep them. Values that are not exactly two letters are ignored.'
                language_not:
                  type: array
                  items:
                    type: string
                  description: Exclude postings written in any of these languages, as lowercase ISO 639-1 codes, e.g. ["fr"]. Postings we have not labelled are kept, so this narrows by known language rather than requiring one.
                source_or:
                  type: array
                  items:
                    type: string
                  description: 'Match any collector source/platform (OR). Job boards: linkedin, indeed, cvlibrary, resumelibrary, ycombinator, arbeitnow, himalayas, jobicy, themuse, remoteok, workingnomads, landingjobs, remotive, rise, bayt. Public employment services: eures, jobtech. ATS (company career sites): greenhouse, workday, ashby, lever, workable, recruitee, personio, smartrecruiters, breezy, paylocity, manatal, jobscore, teamtailor, pinpoint, hirehive. Case, spaces and punctuation are ignored ("CV-Library" = cvlibrary); aliases: yc for ycombinator, breezyhr for breezy. An unrecognized source matches nothing.'
                source_not:
                  type: array
                  items:
                    type: string
                  description: Exclude these collector sources. Same accepted values and aliases as source_or; an unrecognized source excludes nothing.
                job_country_code_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these ISO country codes, e.g. ["US","GB"].
                job_country_code_not:
                  type: array
                  items:
                    type: string
                  description: Exclude these ISO country codes.
                job_location_or:
                  type: array
                  items:
                    type: string
                  description: Match jobs whose city or region contains any of these, e.g. ["Seattle","WA"]. Metro wrappers are stripped ("Greater London" also matches London), and a US state, Canadian province or UK nation by name matches every spelling of it ("Pennsylvania" also matches PA). Terms of three characters or fewer are codes or exact names and match whole values (WA is Washington state, never Iowa); a country code or name matches the whole country. Combine with job_country_code_or to disambiguate same-named cities. For a city by name, city_or is the precise filter.
                city_or:
                  type: array
                  items:
                    type: string
                  description: 'Whole city names, e.g. ["London","Munich"]. Case-insensitive, and a metro wrapper on the stored value is ignored ("Greater London" and "London Area" are London). Spellings and diacritics are normalised for cities we know: "München" finds Munich, "Cracow" finds Kraków. Other cities match the stored value exactly. Combine with job_country_code_or to disambiguate same-named cities; use job_location_or for substring matching.'
                posted_at_max_age_days:
                  type: integer
                  description: Only postings newer than this many days.
                posted_at_gte:
                  type: string
                  description: Only postings on or after this date (YYYY-MM-DD).
                posted_at_lte:
                  type: string
                  description: Only postings on or before this date (YYYY-MM-DD).
                discovered_at_gte:
                  type: string
                  description: Only postings first discovered by JobsPipe at or after this UTC datetime (YYYY-MM-DD HH:MM:SS). Tracks when we first saw the posting, not when it was posted; use it to poll for new jobs without re-reading the corpus.
                company_name_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these company names (exact).
                company_name_partial_match_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these company names (partial).
                company_technology_slug_or:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  maxItems: 10
                  description: Beta. Only jobs at companies whose postings show they use any of these technologies (evidence tier likely or confirmed), e.g. ["snowflake", "dbt"]. At most 10 slugs. Returns 400 until the filter is enabled for the API.
                min_employee_count:
                  type: integer
                  description: Only jobs at companies with at least this many employees. Uses the exact headcount where known, otherwise the lower bound of the company's size band.
                max_employee_count:
                  type: integer
                  description: Only jobs at companies with at most this many employees. Uses the exact headcount where known; a company known only by a size band matches when the band starts at or below this number.
                include_unknown_size:
                  type: boolean
                  description: Also return jobs at companies whose employee count is unknown. Size data covers roughly half the corpus, and min/max_employee_count exclude every unknown-size company by default.
                min_revenue_usd:
                  type: number
                  minimum: 0
                  description: Only jobs at companies whose estimated annual revenue, in US dollars, is at least this amount (the published revenue_usd). Companies with no revenue on record are excluded unless include_unknown contains "company_revenue".
                max_revenue_usd:
                  type: number
                  minimum: 0
                  description: Only jobs at companies whose estimated annual revenue, in US dollars, is at most this amount (the published revenue_usd). Companies with no revenue on record are excluded unless include_unknown contains "company_revenue".
                lei_or:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9A-Z]{20}$
                  minItems: 1
                  maxItems: 50
                  description: Legal Entity Identifiers (ISO 17442). Matches jobs at a company with one of these LEIs or at any company in the corporate group the LEI heads. 1 to 50 LEIs of 20 letters and digits, e.g. ["5493001KJTIIGC8Y1R12"]; case is ignored, and a comma-separated string is accepted. Jobs at companies without a known LEI never match.
                company_key_or:
                  type: array
                  items:
                    type: string
                    pattern: ^\d{1,20}$
                  minItems: 1
                  maxItems: 50
                  description: 'Company ids from the Companies endpoints (the key of a row of POST /v1/jobs/companies, or of a company profile). Matches only jobs at exactly these companies: unlike company_name_or, a name is never matched as a prefix, so Apple''s id never brings in Apple Bank. 1 to 50 ids as strings of digits, e.g. ["14189461223778919517"]; a comma-separated string is accepted.'
                company_hq_country_or:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                  minItems: 1
                  maxItems: 50
                  description: 'Only jobs at companies headquartered in one of these countries, as ISO 3166-1 alpha-2 codes, e.g. ["US","DE"]. This is where the company is based, not where the job is: combine with job_country_code_or for "German companies hiring in the US". Case is ignored and a comma-separated string is accepted. Companies with no known headquarters never match.'
                company_hq_country_not:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{2}$
                  minItems: 1
                  maxItems: 50
                  description: Only jobs at companies headquartered outside these countries (ISO 3166-1 alpha-2). Companies with no known headquarters never match.
                include_unlabeled_employment_type:
                  type: boolean
                  description: Also return jobs whose employment type is unknown. About 27% of postings do not state one, and employment_type_or excludes every one of them by default.
                job_seniority_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these seniority levels.
                include_unlabeled_seniority:
                  type: boolean
                  description: Also return jobs whose seniority is unknown. About 55% of postings do not state a level, and job_seniority_or excludes every one of them by default.
                skills_or:
                  type: array
                  items:
                    type: string
                  description: Match jobs tagged with any of these skill slugs (e.g. ["python", "kubernetes"]). Skills are extracted from title + description against a curated lexicon.
                occupation_code_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these ISCO-08 occupation codes. 4-digit codes match exactly (e.g. "2512" Software Developers); 1-3 digit codes match as hierarchy prefixes (e.g. "25" = all ICT professionals).
                isic_division_or:
                  type: array
                  items:
                    type: string
                  description: Match employers in any of these ISIC Rev.4 industry divisions (2-digit, e.g. "62" Computer programming and consultancy).
                region_or:
                  type: array
                  items:
                    type: string
                  description: US states and Canadian provinces as ISO 3166-2 codes, e.g. ["US-NY", "CA-ON"]. Qualified by country because the underlying column stores "CA" for California while "CA" is also Canada's country code. Matches every spelling a job board publishes, so "CA-ON" finds both "ON" and "Ontario".
                employer_type_or:
                  type: array
                  items:
                    type: string
                    enum:
                    - employer
                    - agency
                    - broker
                  description: Match only these employer types. "employer" hires for itself, "agency" is a staffing or recruitment firm posting for a client, "broker" is a job board republishing another company's listing. Selecting "employer" also returns jobs whose employer has not been classified yet.
                employer_type_not:
                  type: array
                  items:
                    type: string
                    enum:
                    - employer
                    - agency
                    - broker
                  description: Exclude these employer types. Unclassified employers are never excluded, so ["agency","broker"] returns direct employers plus jobs whose employer has not been classified yet - the same set as employer_type_or ["employer"].
                remote:
                  type: boolean
                  description: true for remote-only, false to exclude remote.
                work_arrangement_or:
                  type: array
                  items:
                    type: string
                    enum:
                    - remote
                    - hybrid
                    - onsite
                  description: Match any of "remote", "hybrid" or "onsite". Finer than `remote`, which answers false for hybrid and onsite alike. Jobs whose arrangement is unknown never match.
                job_id_or:
                  type: array
                  items:
                    type: string
                  description: Return jobs matching any of these IDs.
                job_ids:
                  type: array
                  items:
                    type: string
                  description: Look up a specific set of job IDs.
                status:
                  type: string
                  enum:
                  - active
                  - closed
                  - any
                  description: 'Filter by lifecycle: active (default, still open), closed, or any.'
                visa_sponsorship_or:
                  type: array
                  items:
                    type: string
                    enum:
                    - offers
                    - 'no'
                    - citizenship_required
                  description: 'Match any of these visa stances, parsed from the posting text: "offers" (sponsorship available), "no" (explicitly not available), "citizenship_required" (citizenship or security clearance required). Jobs that say nothing never match.'
                benefits_or:
                  type: array
                  items:
                    type: string
                  description: 'Match jobs advertising any of these benefit slugs, e.g. ["401k", "health_insurance", "paid_time_off"] (any spelling: "health insurance" works too). Benefits come from structured board data (Indeed today), so coverage is partial; see metadata.field_coverage.'
                metro_code_or:
                  type: array
                  items:
                    type: string
                  description: Match any of these US CBSA metro codes (e.g. "35620" New York). Resolved from the job's city/region; non-US jobs never match.
                max_applicant_count:
                  type: integer
                  minimum: 0
                  description: Only jobs with at most this many applicants. Applicant counts exist only where the source exposes them (LinkedIn), so this filter also drops every job without a count.
                has_recruiter_email:
                  type: boolean
                  description: true for only jobs with a recruiter contact email parsed from the posting, false for only jobs without one.
                min_salary_usd:
                  type: integer
                  minimum: 0
                  description: Only jobs whose posted salary reaches this annual USD amount (the max of the posted range, annualized). Jobs without a posted salary never match; estimated salaries are not consulted.
                max_ghost_score:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: 'Exclude jobs whose ghost-likelihood score (0-100) exceeds this. Unscored jobs always pass: the filter drops known-likely ghost jobs, it does not require a score.'
                esco_skill_id_or:
                  type: array
                  items:
                    type: string
                  description: Match jobs tagged with any of these ESCO skill concept IDs (exact match). See each job's esco_skills for the id/label pairs.
                include_unknown:
                  type: array
                  items:
                    type: string
                    enum:
                    - employment_type
                    - seniority
                    - work_arrangement
                    - location
                    - occupation
                    - industry
                    - visa_sponsorship
                    - benefits
                    - company_size
                    - company_revenue
                    - salary
                    - language
                  description: 'Also match jobs whose value is UNKNOWN for these fields, e.g. ["seniority", "location"]. Without it every filter drops unknowns: a job with no seniority never matches job_seniority_or. "location" widens region_or within each subdivision''s country, and job_location_or only when job_country_code_or is set. include_unknown_size, include_unlabeled_seniority and include_unlabeled_employment_type are aliases of "company_size", "seniority" and "employment_type".'
                last_verified_max_age_days:
                  type: integer
                  minimum: 1
                  description: Only jobs seen on their source (or re-written) within this many days. Active jobs are closed when a re-check finds them gone, and re-checks take time; this drops the ones we have not confirmed recently.
                cursor:
                  type: string
                  description: Opaque cursor from metadata.next_cursor to fetch the next page.
                delta_cursor:
                  type: string
                  description: Opaque cursor from metadata.next_delta_cursor. Returns only postings JobsPipe first discovered since that cursor was issued, so a repeating query reads new jobs instead of the whole result set again. Keep the rest of the filters identical between calls. Supersedes discovered_at_gte when both are sent. The bound is inclusive to the second, so a posting discovered in the boundary second can repeat once; it is not billed twice in the same calendar month.
                order_by:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      desc:
                        type: boolean
                    required:
                    - field
                  description: Sort order. Only [{"field":"posted_at","desc":true}] is supported, which is how every response is already sorted; anything else is rejected rather than silently ignored.
              additionalProperties: false
              description: Job search filters. All fields optional; combine with AND. Unknown parameters are rejected with HTTP 400.
            example:
              description_or:
              - python
              - django
              job_country_code_or:
              - US
              remote: true
              posted_at_max_age_days: 7
              limit: 25
              include_total_results: true
      responses:
        '200':
          description: Job search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      total_results:
                        type:
                        - number
                        - 'null'
                        description: Total matches, or null unless include_total_results was set.
                      truncated_results:
                        type: number
                        description: Jobs returned in this data array.
                      total_companies:
                        type:
                        - number
                        - 'null'
                      truncated_companies:
                        type: number
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, or null if no more results.
                      next_delta_cursor:
                        type:
                        - string
                        - 'null'
                        description: 'Pass as delta_cursor on the next run of this same query to get only postings discovered since now. Null while next_cursor is set: the watermark is only meaningful once you have read the whole result set, so finish paging first and use the cursor from the last page.'
                      credits_charged:
                        type: number
                        description: Credits this call cost. One credit buys a job for the rest of the calendar month (UTC), so this is the number of jobs in data that the account had not already paid for this month, plus technologies_credits_charged when include_technologies was set.
                      jobs_already_paid:
                        type: number
                        description: Jobs in data that cost nothing because the account already paid for them this month. Without include_technologies, credits_charged plus jobs_already_paid equals the number of jobs returned.
                      technologies_credits_charged:
                        type: number
                        description: 'Present only with include_technologies. The part of credits_charged spent on technologies: 1 per returned job that names at least one technology and whose technologies the account had not already paid for this month.'
                      technologies_already_paid:
                        type: number
                        description: Present only with include_technologies. Jobs whose technologies cost nothing because the account already paid for them this month. technologies_credits_charged plus technologies_already_paid equals the number of returned jobs that name a technology.
                      credits_remaining:
                        type: number
                        description: 'Credits the account can still spend after this call: what is left of the monthly allowance plus extra credits, or on Free what is left of the one-time grant.'
                      credits_allowance:
                        type: number
                        description: 'What credits_remaining is measured against: the monthly allowance on a paid package, the one-time grant on Free.'
                      field_coverage:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            field:
                              type: string
                            filled_pct:
                              type: number
                            by_source:
                              type: object
                              additionalProperties:
                                type: number
                          required:
                          - field
                          - filled_pct
                          - by_source
                        description: 'For each filter the request used that reads a partially filled field: the share (0-100) of active postings from the last 30 days that carry the field, overall and per source. Use it to tell ''no matches'' from ''field unknown''; include_unknown widens the filter.'
                    required:
                    - total_results
                    - truncated_results
                    - total_companies
                    - truncated_companies
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          anyOf:
                          - type: string
                          - type: number
                          description: 'Stable JobsPipe ID. Stable for a given posting over time, so it can be stored and re-looked-up. NOT shared across sources: the same role posted to two boards is keyed per source and gets two IDs.'
                        job_title:
                          type: string
                        normalized_title:
                          type:
                          - string
                          - 'null'
                        url:
                          type:
                          - string
                          - 'null'
                        final_url:
                          type:
                          - string
                          - 'null'
                          description: Always null - use url or source_url.
                        source_url:
                          type:
                          - string
                          - 'null'
                        company:
                          type:
                          - string
                          - 'null'
                        company_domain:
                          type:
                          - string
                          - 'null'
                        company_object:
                          type:
                          - object
                          - 'null'
                          properties:
                            name:
                              type:
                              - string
                              - 'null'
                            domain:
                              type:
                              - string
                              - 'null'
                            url:
                              type:
                              - string
                              - 'null'
                            logo:
                              type:
                              - string
                              - 'null'
                            employee_count:
                              type:
                              - number
                              - 'null'
                            employee_count_min:
                              type:
                              - number
                              - 'null'
                            linkedin_url:
                              type:
                              - string
                              - 'null'
                            description:
                              type:
                              - string
                              - 'null'
                            location:
                              type:
                              - object
                              - 'null'
                              properties:
                                street:
                                  type:
                                  - string
                                  - 'null'
                                city:
                                  type:
                                  - string
                                  - 'null'
                                region:
                                  type:
                                  - string
                                  - 'null'
                                postal_code:
                                  type:
                                  - string
                                  - 'null'
                                country:
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - street
                              - city
                              - region
                              - postal_code
                              - country
                            founded:
                              type:
                              - string
                              - 'null'
                              description: Year the company was founded, where known.
                            intelligence:
                              type:
                              - object
                              - 'null'
                              properties:
                                revenue_usd:
                                  type:
                                  - number
                                  - 'null'
                                  description: Most recent known annual revenue, converted to US dollars. Null when no figure is known.
                                revenue_year:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Fiscal year the revenue figure refers to.
                                revenue_source:
                                  type:
                                  - string
                                  - 'null'
                                  description: Short identifier of where the revenue figure came from, such as a business register, a securities filing or a company directory.
                                revenue_confidence:
                                  type:
                                  - string
                                  - 'null'
                                  enum:
                                  - filed
                                  - reported
                                  - band
                                  - derived
                                  - extracted
                                  description: 'How the revenue figure was obtained, strongest first: filed = taken from the company''s statutory accounts; reported = stated by the company itself; band = only an estimated range is known; revenue_usd is a representative figure within it; derived = estimated from funding or valuation; extracted = read from public text about the company.'
                                entity_kind:
                                  type:
                                  - string
                                  - 'null'
                                  description: 'What kind of organisation the employer is: company, branch, public_sector or staffing_agency.'
                                founded_year:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Year the legal entity was founded or registered.
                                headcount:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Employee count as filed, registered or listed in a company directory. Can differ from company_object.employee_count, which comes from the company's public profile.
                                industry:
                                  type:
                                  - string
                                  - 'null'
                                  description: Industry as recorded for the legal entity or, where no record exists, the industry a company directory lists.
                                hq_region:
                                  type:
                                  - string
                                  - 'null'
                                  description: Region or state of the employer's headquarters, as written by the source (for example California), when known.
                                hq_city:
                                  type:
                                  - string
                                  - 'null'
                                  description: City of the employer's headquarters, when known.
                                revenue_low_usd:
                                  type:
                                  - number
                                  - 'null'
                                  description: 'Lower bound of the revenue, in US dollars: the range behind the figure when the source gave one; null otherwise.'
                                revenue_high_usd:
                                  type:
                                  - number
                                  - 'null'
                                  description: 'Upper bound of the revenue, in US dollars: the range behind the figure when the source gave one; null otherwise.'
                                headcount_low:
                                  type:
                                  - integer
                                  - 'null'
                                  description: 'Lower bound of the headcount: the range behind the figure when the source gave one; null otherwise.'
                                headcount_high:
                                  type:
                                  - integer
                                  - 'null'
                                  description: 'Upper bound of the headcount: the range behind the figure when the source gave one; null otherwise.'
                                lei:
                                  type:
                                  - string
                                  - 'null'
                                  description: The company's Legal Entity Identifier (ISO 17442), 20 characters. Null when we have not identified the company's legal entity.
                                legal_name:
                                  type:
                                  - string
                                  - 'null'
                                  description: The registered legal name of the entity `lei` identifies. Null when `lei` is null.
                                group_lei:
                                  type:
                                  - string
                                  - 'null'
                                  description: 'The LEI of the corporate group the company belongs to: its ultimate parent, or its direct parent when no ultimate parent is recorded. Null when the company has no recorded parent, or when `lei` is null. Can equal `lei` when the company heads its own group.'
                                group_name:
                                  type:
                                  - string
                                  - 'null'
                                  description: The registered legal name of the entity `group_lei` identifies. Null when `group_lei` is null.
                              required:
                              - revenue_usd
                              - revenue_year
                              - revenue_source
                              - revenue_confidence
                              - entity_kind
                              - founded_year
                              - headcount
                              - industry
                              - hq_region
                              - hq_city
                              - revenue_low_usd
                              - revenue_high_usd
                              - headcount_low
                              - headcount_high
                              - lei
                              - legal_name
                              - group_lei
                              - group_name
                              description: Revenue, legal identity and entity type of the employer. Null when no record exists for the company in the posting's country or the record holds no finding, and always null on GET /v1/companies/{key}, which has no posting country to resolve against.
                          required:
                          - name
                          - domain
                          - url
                          - logo
                          - employee_count
                          - employee_count_min
                          - linkedin_url
                          - description
                          - location
                          - founded
                          - intelligence
                          description: Structured details about the hiring company. Every field is independently optional.
