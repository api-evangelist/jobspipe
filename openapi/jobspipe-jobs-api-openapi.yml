  /v1/jobs/companies/{key}:
    get:
      operationId: getCompanyProfile
      tags:
      - Jobs
      summary: Company page
      description: 'One company''s page: who it is, how its hiring is changing against the market (momentum against its industry, function mix, AI share, seniority, where it hires, new and quiet locations, leadership roles), its technology changes, and the companies of its corporate group. A group is addressed as g-. Costs one credit; a company already paid for this calendar month is free, and a company that is not found or has no postings costs nothing.'
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          pattern: ^(\d{1,20}|[gG]-[A-Za-z0-9]{20})$
          description: The company's `key` from a companies or job search response, or a group as `g-<LEI>`.
          example: '3837186692681720328'
        required: true
        description: The company's `key` from a companies or job search response, or a group as `g-<LEI>`.
        name: key
        in: path
      - schema:
          type: string
          description: 'Comma-separated sections to return: header, trends, subsidiaries, tech_changes, facts, offices, peers. All by default.'
          example: header,trends
        required: false
        description: 'Comma-separated sections to return: header, trends, subsidiaries, tech_changes, facts, offices, peers. All by default.'
        name: sections
        in: query
      responses:
        '200':
          description: The company's page
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  found:
                    type: boolean
                  header:
                    type:
                    - object
                    - 'null'
                    properties:
                      key:
                        type: string
                      kind:
                        type: string
                        enum:
                        - company
                        - group
                      name:
                        type: string
                      legal_name:
                        type:
                        - string
                        - 'null'
                      lei:
                        type:
                        - string
                        - 'null'
                      description:
                        type:
                        - string
                        - 'null'
                      domain:
                        type:
                        - string
                        - 'null'
                      website:
                        type:
                        - string
                        - 'null'
                      logo:
                        type:
                        - string
                        - 'null'
                      linkedin_url:
                        type:
                        - string
                        - 'null'
                      employee_count:
                        type:
                        - number
                        - 'null'
                      employee_range:
                        type:
                        - object
                        - 'null'
                        properties:
                          min:
                            type: integer
                          max:
                            type:
                            - integer
                            - 'null'
                            description: Null for an open top band, e.g. 10,001+.
                        required:
                        - min
                        - max
                        description: The size band the company states on its public profile, e.g. 1,001-5,000. Can differ from employee_count, which counts people.
                      revenue_usd:
                        type:
                        - number
                        - 'null'
                      industry:
                        type:
                        - string
                        - 'null'
                      hq_country:
                        type:
                        - string
                        - 'null'
                        description: Where the company is headquartered, ISO 3166-1 alpha-2.
                      hq_city:
                        type:
                        - string
                        - 'null'
                      founded:
                        type:
                        - number
                        - 'null'
                      followers:
                        type:
                        - integer
                        - 'null'
                        description: Followers of the company's public profile; null when unknown.
                      org_type:
                        type:
                        - string
                        - 'null'
                        description: 'How the company describes itself on its public profile: "Privately Held", "Public Company", "Nonprofit"...; null when unknown.'
                      open_jobs:
                        type: integer
                      total_jobs:
                        type: integer
                        description: Every posting we have seen from the company, open or closed.
                      countries:
                        type: integer
                        description: Countries with open jobs.
                      last_posted:
                        type:
                        - string
                        - 'null'
                      group:
                        type:
                        - object
                        - 'null'
                        properties:
                          lei:
                            type: string
                          legal_name:
                            type:
                            - string
                            - 'null'
                        required:
                        - lei
                        - legal_name
                        description: The top of the company's corporate group, when it is part of one.
                      parent_of:
