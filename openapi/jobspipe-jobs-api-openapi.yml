  /v1/jobs/companies/{key}/summary:
    post:
      operationId: summarizeCompanyProfile
      tags:
      - Jobs
      summary: Company page summary
      description: 'What is changing at the company, in 3 to 5 sentences each tagged investor, government or sales, written from the company page''s figures only: every number in it is one of the figures returned beside it. Rewritten once a day. Free.'
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          pattern: ^(\d{1,20}|[gG]-[A-Za-z0-9]{20})$
          description: The company's `key` from a companies or job search response, or a group as `g-<LEI>`.
          example: '3837186692681720328'
        required: true
        description: The company's `key` from a companies or job search response, or a group as `g-<LEI>`.
        name: key
        in: path
      responses:
        '200':
          description: The day's summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  date:
                    type: string
                    description: The UTC day the summary was written for; it is rewritten daily.
                  source:
                    type: string
                    enum:
                    - ai
                    - template
                    description: '"ai" when written by a language model, "template" when built directly from the figures.'
                  bullets:
                    type: array
                    items:
                      type: object
                      properties:
                        audience:
                          type: string
                          enum:
                          - investor
                          - government
                          - sales
                        text:
                          type: string
                      required:
                      - audience
                      - text
                    description: 3 to 5 sentences, each for the reader it matters most to.
                  facts:
                    type: object
                    properties:
                      company:
                        type: string
                      window_weeks:
                        type: number
                    required:
