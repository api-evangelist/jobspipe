aid: jobspipe
name: JobsPipe
image: https://jobspipe.dev/opengraph-image?b21373484c707b8f
description: JobsPipe provides a universal jobs API and hiring-signal platform that aggregates and normalizes job postings from over 30 applicant
  tracking systems and job boards, including LinkedIn, Indeed, Workday, Greenhouse, Lever, and Ashby. It offers real-time webhooks, AI-parsed
  salary ranges, and historical data, enabling AI agents and developers to integrate comprehensive job market data into their applications.
